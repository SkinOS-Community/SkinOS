[workspace]
members = ["crates/runtime-probe", "crates/client-core", "crates/runtime-host", "crates/downloader", "crates/sdk-probe", "crates/compat", "crates/dependency-assets"]
resolver = "3"

[workspace.package]
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep development authentication/UI behavior while making large SteamPipe
# hashes and decompression practical for real game downloads.

[profile.dev.package.skinos-downloader]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3

[profile.dev.package.crypto-common]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.cbc]
opt-level = 3

[profile.dev.package.cipher]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.lzma-rs]
opt-level = 3

[profile.dev.package.ruzstd]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3
