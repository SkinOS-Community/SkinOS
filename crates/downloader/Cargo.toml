[package]
name = "skinos-downloader"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "rt", "macros"] }
steam-cm-protocol = { path = "../client-core/vendor/steam-cm-protocol" }
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
sha1 = "0.10"
aes = "0.8"
cbc = "0.1"
base64 = "0.22"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
lzma-rs = "0.3"
ruzstd = "0.7"
crc32fast = "1"
plist = "1"
keyvalues-parser = "0.2.4"
fs2 = "0.4.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
