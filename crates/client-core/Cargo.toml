[package]
name = "skinos-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
steam-cm-protocol = { path = "vendor/steam-cm-protocol" }
zeroize = "1"
skinos-downloader = { path = "../downloader" }
shlex = "1"
skinos-compat = { path = "../compat" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
base64 = "0.22"
html-escape = "0.2"
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
